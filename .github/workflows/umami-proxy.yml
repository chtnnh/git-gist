# Deploy first-party Umami proxy Worker (gg.chtnnhfoundation.org/stats*).
name: Umami proxy

on:
  push:
    branches: [main]
    paths:
      - "workers/umami-proxy/**"
      - ".github/workflows/umami-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/umami-proxy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: workers/umami-proxy/package-lock.json

      - name: Install and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy
