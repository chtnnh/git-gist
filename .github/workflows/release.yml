name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Gate publishing on the same checks as CI so a green release never races a red CI.
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  coverage:
    name: coverage (≥95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex '(tests/|/cargo/registry/)'
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Enforce ≥95% line coverage
        run: |
          python3 - <<'PY'
          import re, sys
          threshold = 95.0
          text = open("coverage-summary.txt").read()
          for line in text.splitlines():
              if not line.startswith("TOTAL"):
                  continue
              percents = re.findall(r"(\d+\.\d+)%", line)
              if len(percents) < 3:
                  print(f"FAIL: bad TOTAL percents {percents}", file=sys.stderr)
                  sys.exit(1)
              line_pct = float(percents[2])  # Lines Cover
              rounded = round(line_pct, 1)
              print(f"Line coverage: {line_pct:.2f}% → {rounded:.1f}%")
              if rounded + 1e-9 < threshold:
                  print(f"FAIL: {rounded:.1f}% < {threshold:.0f}%", file=sys.stderr)
                  sys.exit(1)
              print("PASS")
              sys.exit(0)
          print("FAIL: TOTAL line not found", file=sys.stderr)
          sys.exit(1)
          PY

  release:
    name: release (${{ matrix.os }})
    needs: [quality, coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Package unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN=target/release/gg
          STAGE=dist/gg-${{ matrix.target }}
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/gg"
          cp README.md LICENSE "$STAGE/"
          ./target/release/gg man --output "$STAGE/gg.1" || true
          tar -C dist -czf "dist/git-gist-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "gg-${{ matrix.target }}"
      - name: Package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/gg.exe dist/gg.exe
          Compress-Archive -Path dist/gg.exe,README.md,LICENSE -DestinationPath "dist/git-gist-${{ env.GITHUB_REF_NAME }}-x86_64-pc-windows-msvc.zip"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  packages-linux:
    name: deb + rpm
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Install packagers
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build deb
        run: cargo deb --output dist/
      - name: Build rpm
        run: |
          mkdir -p dist
          cargo generate-rpm
          cp target/generate-rpm/*.rpm dist/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  publish:
    name: publish github release
    needs: [release, packages-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
