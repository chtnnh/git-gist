name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Package unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN=target/release/gg
          STAGE=dist/gg-${{ matrix.target }}
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/gg"
          cp README.md LICENSE "$STAGE/"
          ./target/release/gg man --output "$STAGE/gg.1" || true
          tar -C dist -czf "dist/git-gist-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "gg-${{ matrix.target }}"
      - name: Package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/gg.exe dist/gg.exe
          Compress-Archive -Path dist/gg.exe,README.md,LICENSE -DestinationPath "dist/git-gist-${{ env.GITHUB_REF_NAME }}-x86_64-pc-windows-msvc.zip"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  packages-linux:
    name: deb + rpm
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Install packagers
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build deb
        run: cargo deb --output dist/
      - name: Build rpm
        run: |
          mkdir -p dist
          cargo generate-rpm
          cp target/generate-rpm/*.rpm dist/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  publish:
    name: publish github release
    needs: [release, packages-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
