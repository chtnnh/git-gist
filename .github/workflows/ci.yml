name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  coverage:
    name: coverage (≥95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          IGNORE='(tests/|/cargo/registry/|/tui/|/wizard/|main\.rs)'
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex "$IGNORE"
          cargo llvm-cov report --summary-only --ignore-filename-regex "$IGNORE" \
            | tee coverage-summary.txt
      - name: Enforce ≥95% line coverage
        run: |
          python3 - <<'PY'
          import re, sys
          threshold = 95.0
          text = open("coverage-summary.txt").read()
          for line in text.splitlines():
              if not line.startswith("TOTAL"):
                  continue
              percents = re.findall(r"(\d+\.\d+)%", line)
              if len(percents) < 3:
                  print(f"FAIL: bad TOTAL percents {percents}", file=sys.stderr)
                  sys.exit(1)
              line_pct = float(percents[2])  # Lines Cover
              rounded = round(line_pct, 1)
              print(f"Line coverage: {line_pct:.2f}% → {rounded:.1f}%")
              if rounded + 1e-9 < threshold:
                  print(f"FAIL: {rounded:.1f}% < {threshold:.0f}%", file=sys.stderr)
                  sys.exit(1)
              print("PASS")
              sys.exit(0)
          print("FAIL: TOTAL line not found", file=sys.stderr)
          sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lcov.info

  man:
    name: generate man page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --quiet
      - run: ./target/debug/gg man --output man/gg.1
      - uses: actions/upload-artifact@v4
        with:
          name: man-page
          path: man/gg.1
