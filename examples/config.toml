# Example global config — copy to ~/.config/git-gist/config.toml
# On macOS, gg uses ~/Library/Application Support/git-gist/config.toml

schema_version = 1
depth = 6
# jobs = 8
# theme = "default"
# show_path = true
ignore = [
  "**/node_modules/**",
  "**/target/**",
  "**/.cache/**",
  "**/vendor/**",
]

# [aliases]
# api = "/home/you/src/api"

# [groups]
# work = ["api"]

# [remotes]
# company = "git@github.com:company/"

# [profiles.default]
# default_branch = "main"
# user_name = "Your Name"
# user_email = "you@example.com"

# Watch folders and enroll new git repos into aliases / groups / tags.
# Run: gg update   (or gg update --dry-run)
# [[auto_enroll]]
# path = "/home/you/src/learning"
# depth = 6
# tags = ["learning"]
# groups = []
